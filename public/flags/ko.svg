<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#FFFFFF"/>
  <!-- 太极图 -->
  <circle cx="15" cy="10" r="4" fill="none" stroke="#CD2E3A" stroke-width="0.1"/>
  <path d="M15 6 A4 4 0 0 1 15 14 A2 2 0 0 0 15 6" fill="#0047A0"/>
  <path d="M15 6 A4 4 0 0 0 15 14 A2 2 0 0 1 15 6" fill="#CD2E3A"/>
  <!-- 卦象 -->
  <g stroke="#000000" stroke-width="0.4" fill="none">
    <!-- 右上角 - 건(乾) -->
    <line x1="20" y1="4" x2="22" y2="4"/>
    <line x1="20" y1="4.8" x2="22" y2="4.8"/>
    <line x1="20" y1="5.6" x2="22" y2="5.6"/>
    <!-- 左下角 - 곤(坤) -->
    <line x1="8" y1="14.4" x2="9" y2="14.4"/>
    <line x1="9.5" y1="14.4" x2="10" y2="14.4"/>
    <line x1="8" y1="15.2" x2="9" y2="15.2"/>
    <line x1="9.5" y1="15.2" x2="10" y2="15.2"/>
    <line x1="8" y1="16" x2="9" y2="16"/>
    <line x1="9.5" y1="16" x2="10" y2="16"/>
    <!-- 右下角 - 감(坎) -->
    <line x1="20" y1="14.4" x2="21" y2="14.4"/>
    <line x1="21.5" y1="14.4" x2="22" y2="14.4"/>
    <line x1="20" y1="15.2" x2="22" y2="15.2"/>
    <line x1="20" y1="16" x2="21" y2="16"/>
    <line x1="21.5" y1="16" x2="22" y2="16"/>
    <!-- 左上角 - 리(離) -->
    <line x1="8" y1="4" x2="10" y2="4"/>
    <line x1="8" y1="4.8" x2="9" y2="4.8"/>
    <line x1="9.5" y1="4.8" x2="10" y2="4.8"/>
    <line x1="8" y1="5.6" x2="10" y2="5.6"/>
  </g>
</svg> 